name: Software and portable boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[mcp,audio]" build
      - run: python ableton_agent/build_hub_device.py
      - run: python tools/sync_package_resources.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m build
      - run: git diff --check
